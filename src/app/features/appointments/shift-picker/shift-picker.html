<fieldset class="shifts">
  <legend class="shifts__legend">Turno</legend>

  <div class="shifts__grid">
    @for (option of options(); track option.id) {
      <label class="shift" [class.shift--selected]="selected() === option.id">
        <input
          class="visually-hidden"
          type="radio"
          name="shift"
          [value]="option.id"
          [checked]="selected() === option.id"
          (change)="selectedChange.emit(option.id)"
        />

        @switch (option.icon) {
          @case ('morning') {
            <svg class="shift__icon shift__icon--morning" aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4.5" />
              <path
                d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"
              />
            </svg>
          }
          @case ('afternoon') {
            <svg class="shift__icon shift__icon--afternoon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M8 5V3M4.2 6.2L2.8 4.8M4 10H2M11.8 6.2l1.4-1.4" />
              <circle cx="8" cy="10" r="3" />
              <path d="M17 20H8a4 4 0 0 1-.6-8 5 5 0 0 1 9.4 1.2 3.4 3.4 0 0 1 .2 6.8Z" />
            </svg>
          }
        }

        <span class="shift__name">{{ option.name }}</span>
      </label>
    }
  </div>
</fieldset>
