<a class="skip-link" href="#contenido">Saltar al contenido</a>

<app-top-alert />

<div class="layout" [class.layout--with-nav]="isAuthenticated()">
  <header class="topbar">
    <a class="brand" routerLink="/mis-citas">
      <!-- alt vacío a propósito: el enlace ya nombra la institución, así que un
           texto alternativo repetiría la marca dos veces en un lector de pantalla. -->
      <img src="assets/logo2.png" alt="" class="brand__logo" width="40" height="40" />
      <span class="brand__text">
        <span class="brand__name">CMS UAEMéx</span>
        <span class="brand__sub">Portal de pacientes</span>
      </span>
    </a>

    @if (isAuthenticated()) {
      <!-- Navegación de escritorio. En teléfono se oculta y se usa la barra
           inferior, que queda al alcance del pulgar. -->
      <nav class="topnav" aria-label="Navegación principal">
        <a
          routerLink="/mis-citas"
          routerLinkActive="topnav__link--active"
          ariaCurrentWhenActive="page"
          class="topnav__link"
          >Mis citas</a
        >
        <a
          routerLink="/agendar"
          routerLinkActive="topnav__link--active"
          ariaCurrentWhenActive="page"
          class="topnav__link"
          >Agendar</a
        >
      </nav>

      <div class="account">
        <!-- Quién está dentro. Solo aparece cuando se conoce el nombre: el login
             no lo devuelve y se aprende al entrar a "Agendar". -->
        @if (displayName(); as name) {
          <span class="account__name">
            <span class="visually-hidden">Sesión de</span>
            {{ name }}
          </span>
        }

        <!-- Menos peso que antes: es una acción que casi nunca se usa y ocupaba
             una caja con borde en la barra del teléfono. El texto visible sigue
             dentro del nombre accesible, así que un lector de pantalla lo
             encuentra igual. -->
        <button type="button" class="account__logout" (click)="logout()">
          Salir<span class="visually-hidden"> de tu cuenta</span>
        </button>
      </div>
    }
  </header>

  <main class="content" id="contenido" tabindex="-1">
    <router-outlet />
  </main>

  @if (isAuthenticated()) {
    <nav class="bottomnav" aria-label="Navegación principal">
      <a
        routerLink="/mis-citas"
        routerLinkActive="bottomnav__link--active"
        ariaCurrentWhenActive="page"
        class="bottomnav__link"
      >
        <svg
          class="bottomnav__icon"
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4M8 2v4M3 10h18" />
        </svg>
        Mis citas
      </a>
      <a
        routerLink="/agendar"
        routerLinkActive="bottomnav__link--active"
        ariaCurrentWhenActive="page"
        class="bottomnav__link"
      >
        <svg
          class="bottomnav__icon"
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M12 8v8M8 12h8" />
        </svg>
        Agendar
      </a>
    </nav>
  }
</div>
